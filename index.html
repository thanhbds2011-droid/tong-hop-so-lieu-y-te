<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Ứng dụng tra cứu và tổng hợp số liệu Phòng Y tế">
  <title>Tổng hợp số liệu Phòng Y tế</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">TRUNG TÂM BẢO TRỢ XÃ HỘI TÂN HIỆP</p>
      <h1>Tổng hợp số liệu Phòng Y tế</h1>
      <p class="subtitle">Dữ liệu được đồng bộ tập trung từ Google Sheet</p>
    </div>
    <div class="top-actions">
      <button id="btnSync" class="btn light" type="button">↻ Đồng bộ</button>
      <a id="btnInput" class="btn white" href="#" target="_blank" rel="noopener noreferrer">Đăng nhập / Nhập số liệu</a>
    </div>
  </header>

  <main class="container">
    <section class="toolbar card">
      <label>Năm
        <select id="yearSelect" aria-label="Chọn năm"></select>
      </label>
      <label>Tháng
        <select id="monthSelect" aria-label="Chọn tháng"></select>
      </label>
      <button id="btnExport" class="btn secondary" type="button">Xuất CSV</button>
      <div class="sync-status" aria-live="polite">
        <span id="statusDot" class="status-dot"></span>
        <span id="syncText">Chưa đồng bộ</span>
      </div>
    </section>

    <div id="notice" class="notice" hidden></div>

    <nav class="tabs" aria-label="Chức năng">
      <button class="tab active" data-tab="dashboard" type="button">Tổng quan</button>
      <button class="tab" data-tab="lookup" type="button">Tra cứu</button>
      <button class="tab" data-tab="report" type="button">Báo cáo</button>
    </nav>

    <section id="dashboard" class="panel active">
      <div id="kpiGrid" class="kpi-grid"></div>
      <div class="card">
        <div class="section-heading">
          <div>
            <p class="eyebrow dark">TÌNH HÌNH THEO THÁNG</p>
            <h2>So sánh các chỉ tiêu chính</h2>
          </div>
        </div>
        <div id="trendTable" class="table-wrap"></div>
      </div>
    </section>

    <section id="lookup" class="panel">
      <div class="card">
        <div class="section-heading">
          <div>
            <p class="eyebrow dark">TRA CỨU</p>
            <h2>Tìm kiếm chỉ tiêu</h2>
          </div>
          <input id="searchInput" class="search" type="search" placeholder="Nhập tên chỉ tiêu...">
        </div>
        <div id="lookupTable" class="table-wrap"></div>
      </div>
    </section>

    <section id="report" class="panel">
      <div class="card">
        <div class="section-heading">
          <div>
            <p class="eyebrow dark">BÁO CÁO TỰ ĐỘNG</p>
            <h2>Tháng, quý, 6 tháng và cả năm</h2>
          </div>
        </div>
        <div id="reportTable" class="table-wrap"></div>
      </div>
    </section>
  </main>

  <div id="loading" class="loading-overlay" hidden>
    <div class="spinner"></div>
    <p>Đang tải dữ liệu...</p>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>

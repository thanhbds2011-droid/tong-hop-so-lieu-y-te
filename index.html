<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Tổng hợp số liệu Phòng Y tế</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#f4f7f7;font-family:Arial,sans-serif}body{overflow:hidden}
    .loading{position:fixed;inset:0;display:grid;place-items:center;background:#f4f7f7;z-index:2;color:#0f766e;font-weight:700}.loading-box{display:flex;align-items:center;gap:12px;background:#fff;padding:18px 22px;border:1px solid #dbe7e6;border-radius:16px;box-shadow:0 12px 34px rgba(15,70,72,.12)}.spinner{width:26px;height:26px;border:3px solid #cfe4e1;border-top-color:#0f766e;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    iframe{display:block;width:100%;height:100%;border:0;background:#f4f7f7}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <div id="loading" class="loading"><div class="loading-box"><span class="spinner"></span><span>Đang mở ứng dụng Phòng Y tế...</span></div></div>
  <iframe id="appFrame" title="Tổng hợp số liệu Phòng Y tế" allow="clipboard-write" referrerpolicy="strict-origin-when-cross-origin" src="https://script.google.com/macros/s/AKfycbx0BHA-P1sAuGXEtrQatvEsMXMn3d7Pb024mCbu9tRTvaAr0xdy_cA0GPvJ_kFne6dOgw/exec"></iframe>
  <script>
    const frame=document.getElementById('appFrame');
    const loading=document.getElementById('loading');
    frame.addEventListener('load',()=>{loading.hidden=true});
    setTimeout(()=>{loading.hidden=true},15000);
  </script>
</body>
</html>

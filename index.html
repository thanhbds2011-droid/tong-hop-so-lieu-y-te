<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#b8326a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Y tế Tân Hiệp">
  <meta name="description" content="Ứng dụng tổng hợp số liệu Phòng Y tế - Trung tâm Bảo trợ xã hội Tân Hiệp">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>Tổng hợp số liệu Phòng Y tế</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap");
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0}
    body{
      overflow:hidden;
      color:#721740;
      background:#fdf7f9;
      font-family:"Be Vietnam Pro","Segoe UI",Arial,sans-serif;
    }
    .loading{
      position:fixed;
      inset:0;
      z-index:2;
      display:grid;
      place-items:center;
      padding:24px;
      background:
        radial-gradient(circle at 20% 10%,rgba(248,212,225,.72),transparent 28rem),
        linear-gradient(180deg,#fff9fb,#fdf7f9);
      transition:opacity .25s ease,visibility .25s ease;
    }
    .loading[hidden]{display:none}
    .loading-box{
      min-width:min(100%,310px);
      padding:20px 22px;
      display:flex;
      align-items:center;
      gap:13px;
      border:1px solid #efdce4;
      border-radius:18px;
      background:#fff;
      box-shadow:0 16px 42px rgba(101,31,63,.1);
      font-size:13px;
      font-weight:700;
    }
    .spinner{
      width:25px;
      height:25px;
      flex:0 0 auto;
      border:3px solid #f8d4e1;
      border-top-color:#be326b;
      border-radius:50%;
      animation:spin .75s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    iframe{display:block;width:100%;height:100%;border:0;background:#fdf7f9}
    @media (prefers-reduced-motion:reduce){.spinner{animation-duration:1.5s}}
  </style>
</head>
<body>
  <div id="loading" class="loading" role="status" aria-live="polite">
    <div class="loading-box">
      <span class="spinner" aria-hidden="true"></span>
      <span>Đang mở ứng dụng Phòng Y tế...</span>
    </div>
  </div>

  <iframe
    id="appFrame"
    title="Tổng hợp số liệu Phòng Y tế"
    allow="clipboard-write"
    loading="eager"
    referrerpolicy="strict-origin-when-cross-origin"
    src="https://script.google.com/macros/s/AKfycbx0BHA-P1sAuGXEtrQatvEsMXMn3d7Pb024mCbu9tRTvaAr0xdy_cA0GPvJ_kFne6dOgw/exec">
  </iframe>

  <script>
    (function() {
      'use strict';
      var frame = document.getElementById('appFrame');
      var loading = document.getElementById('loading');
      var hideLoading = function() { loading.hidden = true; };
      frame.addEventListener('load', hideLoading);
      window.setTimeout(hideLoading, 15000);

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js').catch(function() {});
        });
      }
    })();
  </script>
</body>
</html>
